---
- include_tasks: arch-aur.yml
  loop:
    - name: brave-bin
      deps: [alsa-lib, gtk3, libxss, nss, ttf-font]
  loop_control:
    loop_var: aur_item
  when: ansible_facts["os_family"] == 'Archlinux'

# https://brave.com/linux/#debian-ubuntu-mint
- name: Brave > importing apt-repo
  become: true
  when: ansible_facts["os_family"] == 'Debian'
  block:
    - name: Brave | apt key
      ansible.builtin.get_url:
        url: https://brave-browser-apt-release.s3.brave.com/brave-browser-archive-keyring.gpg
        dest: /etc/apt/trusted.gpg.d/brave-browser-archive-keyring.gpg

    - name: Brave | apt source
      ansible.builtin.apt_repository:
        repo: deb [arch=amd64 signed-by=/etc/apt/trusted.gpg.d/brave-browser-archive-keyring.gpg] https://brave-browser-apt-release.s3.brave.com/ {{ ansible_facts["distribution_release"] }} main
        filename: brave
        update_cache: true

# Using: https://github.com/gentoo-mirror/brave-overlay
# https://wiki.gentoo.org/wiki/Brave
- name: Brave > for Gentoo
  become: true
  when: ansible_facts["os_family"] == 'Gentoo'
  block:
    - name: Add brave-overlay repository
      ansible.builtin.copy:
        src: brave-overlay.conf
        dest: /etc/portage/repos.conf/brave-overlay.conf
        mode: "0644"

    - name: Sync for brave-overlay
      ansible.builtin.command: emaint -r brave-overlay sync

- name: Brave > installing flatpak
  become: true
  when: ansible_facts["os_family"] == 'Void'
  block:
    - name: Removing flatpak dependencies
      ansible.builtin.package:
        name: flatpak
        state: absent

- name: Brave > Installation on Voidlinux
  ansible.builtin.debug:
    msg: "No brave for Voidlinux yet"
  when: ansible_facts["os_family"] == 'Void'

- name: Brave > installing dependencies
  become: true
  ansible.builtin.package:
    name: "{{ web_browser_brave_pkg }}"
    state: present
  when: web_browser_brave_pkg is defined
